; Copie este arquivo para config.ini (que não é versionado) e preencha com os seus dados.
; Todos os valores abaixo são fictícios.

[Banco]
Servidor=localhost
Porta=3050
Arquivo=C:\Dados\EMISSOR_NFE.FDB
Usuario=SYSDBA
Senha=
; caminho do fbclient.dll, se não estiver na pasta do executável ou no PATH
BibliotecaCliente=

[NFe]
; homologacao ou producao. Mantenha em homologacao.
Ambiente=homologacao
UF=SP
Certificado=C:\Certificados\certificado-a1.pfx
SenhaCertificado=
; XSDs oficiais da NF-e; o ACBr traz a versão atual em <pasta do ACBr>\Exemplos\ACBrDFe\Schemas\NFe
PastaSchemas=C:\ACBr\Exemplos\ACBrDFe\Schemas\NFe
PastaXml=.\xml
; CSC da NFC-e (gerado no portal da SEFAZ para homologação)
IdCSC=000001
CSC=

[ResponsavelTecnico]
; Empresa que desenvolveu o software (grupo infRespTec, obrigatório na maioria das UFs)
CNPJ=11222333000181
Contato=Fulano de Tal
Email=suporte@exemplo.com.br
Fone=1130000000
; CSRT: só nas UFs que exigem, gerado no portal da SEFAZ. 0/vazio = não enviar hash
IdCSRT=0
CSRT=

[Email]
Host=smtp.exemplo.com.br
Porta=587
Usuario=nfe@exemplo.com.br
Senha=
TLS=1
Remetente=nfe@exemplo.com.br
NomeRemetente=Loja Exemplo

[Migracao]
; Cria o arquivo do banco (charset UTF8) se ele ainda não existir. A pasta precisa
; existir no servidor. Desligue em produção: um caminho errado criaria um banco
; vazio em vez de dar erro.
CriarBanco=0
; Aplica na abertura os scripts de database\ que ainda não rodaram (controle na
; tabela SCHEMA_VERSAO). 0 = o banco é responsabilidade de quem implanta.
Executar=1
; Scripts *_seed_* (emitente fictício, produtos e cliente de teste). Só em desenvolvimento.
ExecutarSeeds=0
; Pasta dos scripts, absoluta ou relativa ao executável
Pasta=.\database

[Api]
; delphi-horse-api, de onde vêm os pedidos para faturar (botão "Importar pedido" na NF-e)
; o emissor também avisa a API quando a NF-e de um pedido é autorizada ou cancelada
Url=http://localhost:9000
; em desenvolvimento, o seed da API cria o usuário admin (a senha está no README da API)
Usuario=admin
Senha=
TimeoutSegundos=15

[Log]
Pasta=.\logs
